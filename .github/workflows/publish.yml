name: publish image

# Publishes the code-only `app` image to GitHub Container Registry, so anyone can
# `docker pull ghcr.io/siegried81/flood-policy-kit` instead of building it.
#
# Only `app` is published. `portable` bakes in the 3.82 GiB data tree, which CI
# does not have and which has no business in a public registry anyway; it stays a
# local `docker compose --profile portable build`.
#
# GHCR rather than Docker Hub: the built-in GITHUB_TOKEN is enough to push, so
# there is no registry password to create, store or leak.

on:
  push:
    branches: [main]
    tags: ["v*"]          # `git tag v1.0 && git push --tags` -> :1.0 and :1 tags
  workflow_dispatch:      # manual "Run workflow" button in the Actions tab

# Scoped to this job: read the checkout, write the package. Nothing else.
permissions:
  contents: read
  packages: write

# A newer push to the same ref makes the running publish obsolete.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Buildx is required for the GitHub Actions layer cache below.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme: `latest` + short SHA on main, semver on v* tags.
      # GHCR requires a lowercase image name; the owner is "Siegried81".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/siegried81/flood-policy-kit
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}

      # Build once and load it locally, so the smoke test runs on the exact image
      # that gets pushed - never publish an image nobody has started.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: flood-policy-kit:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same proof as ci.yml's docker job: the native stack the image exists for
      # actually loads inside it.
      - run: docker run --rm flood-policy-kit:smoke python -c "import rasterio, pyogrio, rasterstats, tiktoken; print('native stack loads')"

      # Push the real tags. Every layer is already in the gha cache, so this is
      # an upload, not a second build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
