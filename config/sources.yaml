  - id: wallonia_observed_flooded_areas_2021
    url: https://geoservices.wallonie.be/geotraitement/spwdatadownload/results/5fa27752-74a6-4cf5-bfb9-d0d5d7e9d35c/
    access: download
    crs: EPSG:31370
    licence: CC-BY-4.0
