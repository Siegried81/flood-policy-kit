  - id: hanze_flood_impacts
    # The /records/<id>/files/<name> form, NOT the /api/.../<name>/content one.
    # Both serve the same bytes, but `expand` names a file from the URL's last
    # path segment, so every /content URL resolved to the same `content.bin` and
    # the seven files silently overwrote each other - six of seven lost, with a
    # clean "ok" printed for each. This form ends in the real filename.
    url: https://zenodo.org/records/20478847/files/
    landing: https://doi.org/10.5281/zenodo.20478847
    access: download
    licence: CC-BY-4.0
    doi: 10.5281/zenodo.20478847
    # Sizes measured 2026-10-06; 14.47 MB for the whole set.
    files:
      - HANZE_events_v3_0_1b.csv                  # the event list, 618,212 B
      - HANZE_events_regions_v3_0_1_b_2024.zip    # events x regions, 10,975,350 B
      - HANZE_references_v3_0_1b.csv              # the source behind each event, 268,970 B
      - S2_regions_codes_and_names_v2024.csv      # NUTS 2024 crosswalk, 32,001 B
      - S4_currency_conversion_rates.csv          # 4,258 B
      - S5_GDP_deflators_by_country.csv           # 138,958 B
      - Regions_v2024_simplified.zip              # region geometries, 2,430,309 B
    purpose: >
      HANZE v3.0.1, historical flood impacts in Europe 1870-2025 (Paprotny), the
      long observational record behind part of the Risk Data Hub's numbers. Taking
      it directly is what lets a loss figure be traced to a named event and a
      named reference instead of to an average: HANZE_references gives the source
      per event, which is exactly the provenance a "cite or refuse" project needs.
      Its regions are published on the NUTS 2024 vintage, so it joins gisco_nuts3
      without a crosswalk - the one dataset here that does.
      S4 and S5 are not optional for any euro figure: a 1993 loss and a 2021 loss
      are not comparable until both are deflated and converted.
    caveat: >
      Version is tagged "v3.0.1 beta" by the author - usable, but say "beta" in
      the brief rather than implying a settled dataset.
      It records REPORTED impacts, so coverage improves over time: a rising trend
      in the early decades is partly better reporting, not only more flooding.
      Overlaps the Risk Data Hub, which lists HANZE among its own sources - so the
      two are NOT independent, and agreement between them is not corroboration.
    verified: 2026-10-06

