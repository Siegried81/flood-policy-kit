  # The two documents that carry the "the warning existed, the decision did not
  # follow" argument. Both are official and both are citable, which is the point:
  # the claim stops being rhetoric and becomes a sourced finding.
  - id: efas_assessment_rhine_meuse_2021
    # Robots derogation, declared not inferred. See src/fetch.py.
    robots_unreadable: 2026-10-06
    robots_note: >
      european-flood.emergency.copernicus.eu is a JavaScript single-page app
      that returns the same 4,034-byte HTML shell for /robots.txt as for every other
      path, measured 2026-10-06 - there is no robots.txt to read. One PDF, fetched once.
    url: https://european-flood.emergency.copernicus.eu/sites/default/files/2023-12/JRC135679_CEMS_EFAS_DetailedAssessmentReport_RhineMeuseFloodsJuly2021_FINAL.pdf
    access: scrape
    purpose: >
      JRC135679 - the CEMS technical assessment of how EFAS performed during the
      Meuse and Rhine floods of July 2021, by the people who run the system. It
      records 25 notifications issued (5 formal flood, 6 informal, 14 flash
      flood), and that the Ourthe was notified MORE than two days before the
      predicted start of the event while the Meuse was notified less than two
      days before. That asymmetry is the evidence for the last-mile argument:
      the forecast existed, with lead time, and in writing.
    caveat: >
      7,498,374 B PDF, verified 2026-10-06. It is a self-assessment by the system
      operator, so read it as the operator's own account - which is what makes it
      quotable about the forecast, and what makes it weak evidence about the
      decisions taken downstream. For those, use the Walloon inquiry below.
