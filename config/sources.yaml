    verified: 2026-10-06

  - id: wallonia_observed_water_depth_2021
    url: https://geoservices.wallonie.be/geotraitement/spwdatadownload/results/59f97c7e-c501-4e92-8c47-047d000f4c13/
    access: download
    crs: EPSG:31370
    licence: CC-BY-4.0
    purpose: >
      "Zones inondees IDW - Hauteur d'eau - juillet 2021": observed water DEPTH,
      interpolated. The only Belgian layer directly comparable to the hazard
