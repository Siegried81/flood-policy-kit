    verified: 2026-10-06

  - id: eea_floods_directive_apsfr
    url: https://water.discomap.eea.europa.eu/arcgis/rest/services/FloodsDirective/FloodsDirective_AreasOfPotentialSignificantFloodRisk_WM/MapServer
    landing: https://sdi.eea.europa.eu/
    access: api
    purpose: >
      Areas of Potential Significant Flood Risk, as the Member States themselves
      designated them under Article 5 of the Floods Directive and reported to the
      Commission. Every other hazard layer in this kit measures what the water
      does; this measures what a government SAID about it, and the corpus already
      carries the Directive's text without the reporting behind it.
      Crossed with the modelled hazard and the exposure figures it supports the
      one question a policy audience can act on: where does modelled risk fall
      outside the area the State declared? That is a compliance gap rather than a
      colour ramp. It is NOT evidence that an undeclared area is wrongly
      undeclared - a State may have assessed it under Article 4 and concluded the
      risk is not significant, which the Directive allows - so the defensible
      sentence names the exposure and leaves the conclusion to a human.
    caveat: >
      TWO REPORTING CYCLES in one layer. Measured 2026-10-07: `cYear` is 2010 for
      496 polygons across 5 countries (AT, DE, ES, FR, LT) and 2018 for 12,173
      across 25. AT, DE, ES and FR appear in BOTH, so a query that does not pin
      the cycle designates the same ground twice and an area share can exceed 1.
      `src/apsfr.py` defaults to 2018 and refuses to mix. The cost is real and
      has to be stated beside any map: Lithuania reported in 2010 and not in
      2018, so the current cycle shows it as having declared nothing.
      GENERALISATION IS MANDATORY AND DANGEROUS. Ungeneralised the service answers
      50 polygons in 18.7 MB and refuses any `cYear` query with HTTP 500 - under
      `f=json`, a 200 whose body is a 500. But the features are small, a median of
      about 0.001 km2, so a coarse tolerance deletes rather than simplifies them:
      measured on 300 Italian polygons, `maxAllowableOffset=0.001` (~110 m)
      destroys 44% of them and reports Germany, Spain and France as having
      declared nothing, while 0.0001 (~11 m) loses none and stays within 10% of
      the near-exact median area. The kit uses 0.0001; the whole cycle is then
      about 224 MB over ~41 pages, roughly 15 minutes, cached to
      `data/processed/apsfr_cache/`. Like the WFD layer, it must be fetched once
      BEFORE the event: nothing in `src.fetch` or the offline readiness check
      knows about it.
      Served in WEB MERCATOR (EPSG:3857), which inflates area by roughly
      1/cos^2(latitude) - about 2.4x at 50 degrees North and unevenly across
      Europe, so even a ratio of two Mercator areas taken at different latitudes
      is wrong. Every figure is computed in EPSG:3035.
      About 48% of the polygons are self-intersecting after generalisation, and
      shapely's default "linework" repair returns collections mixing lines with
      polygons that the overlay then rejects outright. The structure repair is
      used here instead; see `src/basins.py::repair`.
      IT DOES NOT COVER EVERY MEMBER STATE, and this is the caveat that decides
      whether the layer can carry an accusation. Measured against the service
      2026-10-07: 26 country codes across BOTH cycles, and IRELAND is not one of
      them - zero polygons, for a State that certainly designates areas under
      Article 5. So "no declared area" has two causes that look identical in the
      data, and only one is about the State. `declared_by_region` returns
      `apsfr_country_reported` and leaves the share NaN where the country was
      never covered. Never quote an undeclared region without it.
      A region can also intersect a NEIGHBOUR's declared area, because rivers are
      shared: on the real run, regions in AL, CH, ME, MK, RS and TR come back
      with a declared share although none of those States reports here. That is
      geometrically honest and belongs in the caption.
    verified: 2026-10-07

  - id: eea_natura2000_sites
    url: https://bio.discomap.eea.europa.eu/arcgis/rest/services/ProtectedSites/Natura2000Sites/MapServer
    landing: https://www.eea.europa.eu/en/datahub
    access: api
    purpose: >
      Natura 2000 protected sites, the EU network designated under the Habitats
      and Birds Directives. Declared because Article 6(5) of the Floods Directive
      requires flood risk maps to show the potential adverse consequences for the
      ENVIRONMENT and for cultural heritage, not only for people and economic
      activity - and this kit currently measures residents and built-up surface
      and nothing else. A protected site in a flood zone is a consequence the
      Directive names and the kit cannot yet count.
    caveat: >
      DECLARED, NOT YET USED. No module reads this: it is recorded here so the
      gap against Article 6(5) is traceable rather than silent. Do not cite a
      figure from it until something computes one.
      Verified 2026-10-07: the service answers anonymously and layer 0 holds
      23,799 Habitats Directive sites (pSCI, SCI or SAC); layer 1 is the Birds
      Directive sites (SPA) and layer 2 is both together. Choosing among the
      three is a decision, not a detail - layers 0 and 1 overlap, because a site
      can be designated under both directives, so summing them double-counts.
      Served in WEB MERCATOR (EPSG:3857), like the APSFR layer, so any area has
      to be computed in EPSG:3035. Expect the same geometry volume problem and
      the same need for `maxAllowableOffset`; see `src/apsfr.py` for the measured
      cost of getting that tolerance wrong.
    verified: 2026-10-07

  - id: copernicus_corine_land_cover
    url: https://land.copernicus.eu/en/products/corine-land-cover
    access: api
    purpose: >
      CORINE Land Cover: what the flooded ground actually IS - industrial,
      agricultural, urban fabric, protected. The kit measures people and built-up
      surface, which cannot distinguish a flooded industrial estate from a
      flooded meadow, and the Floods Directive asks for both the economic
      activity and the environmental consequence.
    caveat: >
      DECLARED, NOT YET USED, and the least ready of the three: unlike every
      other source here it is NOT anonymously downloadable. The product page
      answers 200, verified 2026-10-07, but the download itself goes through the
      Copernicus Land Monitoring Service and requires a registered account and an
      accepted licence. That is a pre-event errand with a human in it, not a
      fetch job, so it is declared without a file URL rather than with one that
      would 401 on the day.
    verified: 2026-10-07

  - id: eea_river_basin_districts
    url: https://water.discomap.eea.europa.eu/arcgis/rest/services/WISE_WFD/WFD2016_RiverBasinDistrict_WM/MapServer
    access: api
    purpose: >
      River basin districts as reported under the Water Framework Directive -
      the unit water obeys, as opposed to the unit administrations are drawn on.
      NUTS3 answers "who is exposed". This answers "who is exposed in a basin
      they do not control": the Meuse rises in France, floods Belgium and
      reaches the Netherlands, so a warning issued nationally arrives late
      downstream. That is the argument for EU-level action rather than national
      action, and it cannot be made from NUTS3 alone.
    caveat: >
      Queried through the REST service rather than downloaded in bulk: the EEA's
      bulk option is the entire WISE WFD package as one 3.4 GB Nextcloud share
      with no per-layer file URL, which is not something to pull on a hackathon
      morning. The service answers anonymously and returns GeoJSON.
      `src/basins.py` caches the answer to
      `data/processed/basins_cache/wfd2016_river_basin_districts.geojson`, which
      is **288 MiB** for 196 polygons - the geometry is served unsimplified.
      Measured 2026-10-06: the whole layer takes about two minutes over 8 pages,
      and it must be fetched once BEFORE the event, because nothing in
      `src.fetch` or the offline readiness check knows about it.
      Do NOT ask for `outFields=*`: the layer carries an attribute literally
      named `geometry`, which collides with the GeoJSON key and makes the service
      answer HTTP 500 with no explanation. And do not ask for a large page: 100
      records answer 500 as well. See `OUT_FIELDS` and `PAGE_SIZE` in
      `src/basins.py`.
      A district is NOT an aggregate of NUTS3 regions. Districts cross national
      borders AND cut regions in half, so a figure per district has to be built
      by intersecting areas in EPSG:3035 - summing the NUTS3 rows that "belong"
      to a basin double-counts every region the boundary crosses.
      Reported under the 2016 River Basin Management Plans, so the geometry is a
      reporting vintage like NUTS: say which one beside any number.
    verified: 2026-10-06

  - id: cds_hydrology_projections
    url: https://cds.climate.copernicus.eu/api/catalogue/v1/collections/sis-hydrology-variables-derived-projections
    landing: https://cds.climate.copernicus.eu/datasets/sis-hydrology-variables-derived-projections
    doi: 10.24381/cds.73237ad6
    access: api
    purpose: >
      Hydrology-related climate impact indicators, 1970-2100: eight bias-adjusted
      EURO-CORDEX EUR-11 simulations forcing the E-HYPEcatch hydrological model,
      at 5 km and by catchment (Copernicus C3S / SMHI). The one variable this kit
      wants is `Flood recurrence` - return values of annual maximum river
      discharge at 2, 5, 10 and 50 years. This is the only future climate in the
      kit; every other hazard layer here is present-day. Risk today is a
      description, risk that MOVES is a decision.
      The periods are what make it usable in a brief: a 1971-2000 reference, then
      2011-2040, 2041-2070 and 2071-2100, AND three "degree scenario" periods set
      by when global warming passes 1.5, 2.0 and 3.0 degrees. "Which regions
      become a priority at +2 degrees" is a sentence a decision-maker can act on
      in a way that "RCP8.5 in 2071-2100" is not.
    caveat: >
      It is DISCHARGE, not depth and not extent. A 50-year flow in m3/s cannot be
      subtracted from or layered onto the JRC inundation maps, which are metres of
      water on a 3 arc-second grid. The defensible use is the RATIO between a
      future period and the 1971-2000 reference, read as the direction and size of
      change, applied to the present-day exposure this kit computes. A future
      headcount quoted as if it had been measured is not defensible.
      Different grid and no grid transform at all: measured 2026-10-06, the file
      is NetCDF-4 on a 950x1000 CURVILINEAR grid, with lon and lat carried as
      their own full-size arrays beside the variable. Nothing here aligns
      cell-to-cell with the 1 km Mollweide population grid or the 4326 hazard
      rasters, and resampling onto one would interpolate a ratio, so any join is
      point-in-polygon on the real coordinates, never through cells.
      An ensemble of eight simulations, not a forecast. One member is one
      plausible world: report the spread, or a jury will ask why a 2050 figure
      carries no interval.
      NO LONGER SUPPORTED by the data providers (notice dated 2025-01-29): the
      data and documentation stand as they are, and nobody is fixing them. Say so
      rather than letting a juror find it.
      Fetched BY HAND through the CDS download form, not by any code here: the
      form is where a request's cost is checked against the cap below, and where
      the exact variable, experiment and period identifiers come from. Put the
      resulting `.nc` files in `data/raw/download/cds_hydrology_projections/`,
      which is what `src/climate.py` reads; it needs no credential and there is
      no `CDS_API_KEY`. A free CDS account is needed to use the form - create it
      early, and note that `src.fetch` and the offline readiness check know
      nothing about these files. The CDS Terms of Use change on 28 October 2026 - the day
      before the event - and continued use after that date is acceptance.
      Requests are COST-CAPPED at 1000, and the cost is the product of the boxes
      ticked, not their sum: the form's own default selection (11 variables x 10
      hydrological models x 4 experiments x 6 periods) costs 5040 and is refused.
      Measured 2026-10-06. Ask for one variable, one model, one GCM/RCM/member
      and two periods, and widen afterwards. The variable this kit wants is
      `Flood recurrence 50 years return period` on `E-HYPEgrid`, the 5 km gridded
      model - the E-HYPEcatch members are per catchment and need a catchment join
      rather than an area join onto NUTS3.
      CC-BY means attribution is a CONDITION, not a courtesy: name the dataset,
      its DOI and the licence wherever a figure derived from it appears.
      A RELATIVE change has no upper bound where the reference is near zero, and
      this layer is full of such cells. Measured 2026-10-06 on the 50-year flood
      recurrence, 2041-2070 against 1971-2000, RCP 8.5, E-HYPEgrid: 950 x 1000
      cells, 323,228 of them valid, median +16.9%, minimum -100%, maximum
      +16,452,833%. The median is the signal; the maximum is a division by an
      intermittent river's near-zero reference discharge. Floor the reference, or
      winsorise, or report the median and the quantiles - never the maximum, and
      never a mean, which that tail owns.
      The file carries no geotransform: the 5 km grid is curvilinear, with `lon`
      and `lat` as their own subdatasets beside the variable. GDAL opens it
      (`netCDF:<path>:<variable>`, no extra dependency), but a plain affine read
      places it on the identity matrix - somewhere off Africa. Join through the
      coordinate arrays.
    licence: CC-BY-4.0
    verified: 2026-10-06

