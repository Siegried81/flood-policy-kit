# sources.yaml - single source of truth for every dataset and document used.
#
# Why this file exists: provenance and reproducibility. FARI's manifesto commits
# to open source and Open Science, and the jury includes JRC staff whose own
# catalogue records provenance for everything. Every number in the brief must be
# traceable to a line here. It is also DRY: URLs change, and they change in one
# place.
#
# access:
#   download = bulk file, fetched once with src/fetch.py
#   api      = query endpoint, called at runtime. Not necessarily transient:
#              `src/rdh.py` and `src/basins.py` both cache their answers under
#              `data/processed/`, because a service that is slow or needs a token
#              cannot be relied on at the event. `src/fetch.py` still skips these
#              entries, and so does `scripts/check_offline_readiness.py` - so a
#              missing api cache does NOT show up as "not demo-ready".
#   scrape   = HTML/PDF text pulled into the RAG corpus (robots.txt respected)
#   folder   = directory of files too large to mirror. Declared here for
#              provenance and skipped by src/fetch.py; the pipeline opens a
#              Belgium window at runtime through GDAL /vsicurl/ instead. A GET on
#              such a url returns the directory listing, not a file.
#
# verified: date the URL and its properties were checked against the live source.
# An unverified line is a liability on the day.

geodata:
  - id: jrc_flood_hazard
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/flood_hazard/
    # `download`, not `folder`, BECAUSE it names its files below. `folder` means
    # "declared for provenance, never mirrored, read as a /vsicurl/ window at
    # runtime" - which is Belgium-only and needs the network on the day. Naming
    # the thirteen files instead mirrors 2.79 GiB once and lets the continental
    # build read all 1,345 NUTS3 regions offline. An entry cannot be both: a
    # `folder` entry carrying a `files:` list is skipped with its files ignored.
    access: download
    crs: EPSG:4326          # NOT 3035, and NOT 100 m - see caveat
    # The url above is a DIRECTORY listing, so it is not fetchable on its own.
    # Nine return periods plus the two companion masks, measured 2026-10-06:
    # 272,286,610 / 293,735,892 / 298,074,166 / 304,739,764 / 309,424,632 /
    # 318,236,424 / 323,117,744 / 335,098,080 / 349,928,950 B for RP10..RP500,
    # 112,287,284 B permanent water and 74,730,820 B spurious depth.
    # All nine return periods together are 2.61 GiB.
    files:
      - Europe_RP10_filled_depth.tif
      - Europe_RP20_filled_depth.tif
      - Europe_RP30_filled_depth.tif
      - Europe_RP40_filled_depth.tif
      - Europe_RP50_filled_depth.tif
      - Europe_RP75_filled_depth.tif
      - Europe_RP100_filled_depth.tif
      - Europe_RP200_filled_depth.tif
      - Europe_RP500_filled_depth.tif
      - Europe_permanent_water_bodies.tif
      - Europe_spurious_depth_areas.tif
      - README.txt
      - CHANGELOG.txt
    purpose: >
      River flood hazard maps for Europe, v3.1.1. Nine return periods:
      Europe_RP{10,20,30,40,50,75,100,200,500}_filled_depth.tif, 272-350 MB each.
      Band value is river inundation water depth in METRES. Float32, nodata -9999.
    caveat: >
      Resolution is 3 arc-seconds (0.000833333 deg) in EPSG:4326 - about 92 m
      north-south but only 60 m east-west at Belgian latitudes, so cells are NOT
      square and any area computed in 4326 is wrong. The widely-quoted
      "100 m, ETRS89-LAEA" belongs to the retired v2.x and will misalign a
      pipeline built on the current files.
      Modelled for river basins > 150 km2 only, so small Walloon tributaries are
      absent. JRC states plainly these are NOT official hazard maps.
      Tiled Deflate (256x256, 110162x51992 px, 53% of tiles empty) and the server
      honours HTTP range requests, so /vsicurl/ is the right tool FOR A COUNTRY
      WINDOW and the wrong one for the European run. Measured 2026-10-06 on
      RP100: a Belgium window is 220 tiles and 2.4 MiB over the wire, 0.76% of
      the file; the EU27+EFTA bbox is 35,525 tiles and 172 MiB, i.e. 56% of the
      file fetched in tens of thousands of requests. At this repo's own
      one-request-per-second-per-host rate that is hours per return period, so
      download the whole file for a pan-European zonal run and reserve /vsicurl/
      for the Belgian dress rehearsal.
    companions: >
      Europe_spurious_depth_areas.tif flags places where depth > 10 m is predicted
      in small channels; the README says to treat those values with caution, so
      mask or flag them. Europe_permanent_water_bodies.tif is the layer used to
      patch the depth maps.
    doi: 10.2905/1D128B6C-A4EE-4858-9E34-6210707F3C81
    licence: CC-BY-4.0
    verified: 2026-10-06

  - id: jrc_observed_flood_depth
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/European_Satellite-Derived_Flood_Depth_Maps/
    access: download
    # UNITS ARE CENTIMETRES here, against the hazard maps' METRES. Comparing the
    # two without converting is a factor-100 error that produces a plausible
    # number, which is why it is stated next to the CRS and not only in a caveat.
    crs: Equi7Grid Europe   # azimuthal equidistant; the FILE names no code - see caveat
    licence: CC-BY-4.0
    # The url above holds only README.txt, copyright.txt and maps/. The real
    # rasters are one folder per year, maps/{2015..2025}/, and 2021 alone holds
    # 352 files. File names encode the event: WD_MERGE_[start]---[end]_duration_
    # [n]_days_cluster_[id]_A0_[GFM extent km2]_A_[enhanced extent km2]_lat_
    # [centroid lat x100]_lon_[centroid lon x100]_size_[spread].tif - so the
    # Belgian July 2021 event is selectable from the name alone.
    files:
      - maps/2021/WD_MERGE_2021-07-12---2021-08-02_duration_21_days_cluster_159_A0_000619_A_000852_lat_04942_lon_00499_size_0246.tif
    purpose: >
      OBSERVED flood depth across Europe, 2015-01-01 to 2025-12-31, at 20 m -
      four times finer than the hazard maps. Estimated from Sentinel-1 SAR extent
      (Copernicus Global Flood Monitoring) plus terrain, via the FLEXTH algorithm.
      This is the validation layer: where the modelled hazard maps and a decade of
      observation disagree is a finding about the model, and the hazard maps have
      two documented blind spots (river flooding only, basins > 150 km2) to test.
      The one file listed is the July 2021 event, 38,156,787 B, 45000x60000 px
      uint16: window lat 44.47-57.05, lon -6.86-10.39, so it covers Belgium AND
      the German Ahr valley - both sides of the same flood.
    caveat: >
      Sentinel-1 sees flood EXTENT under cloud but not under dense canopy or in
      very narrow urban streets, and a revisit gap can miss a flash flood that
      drained in hours. So an absence here is weaker evidence than a presence.
      Depth is in CENTIMETRES, uint16, nodata 0, and 9999 marks permanent or
      seasonal water rather than a 99 m flood - mask it before any statistic.
      The CRS is Equi7Grid Europe, declared user-defined (ProjectedCSTypeGeoKey
      32767) with only an ESRI citation string, though pyproj resolves its WKT to EPSG:27704 ("WGS 84 / Equi7 Europe") and
      the file's own ProjCenter keys are the right way round (ProjCenterLong 24.0, ProjCenterLat 53.0, checked 2026-10-06). Pass the proj4
      string, not the file's keys:
      "+proj=aeqd +lat_0=53 +lon_0=24 +x_0=5837287.81977 +y_0=2121415.69617
      +datum=WGS84 +units=m".
      Stored as one-row strips (60,000 of them), not tiled, so a windowed read is
      not cheap here - but the file is only 38 MB, so just download it.
    doi: 10.2905/0bc96690-b89c-4909-9166-c2c322a20130
    verified: 2026-10-06

  - id: ghsl_pop_europe
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_1000/V1-0/GHS_POP_E2025_GLOBE_R2023A_54009_1000_V1_0.zip
    access: download
    crs: ESRI:54009          # World Mollweide. "EPSG:54009" is not a valid code.
    purpose: >
      GHS-POP 1 km population grid, ONE global file (323 MB), the denominator for
      a pan-European NUTS3 analysis. At NUTS3 a region is hundreds of km2, so 1 km
      is ample, and one file removes the whole tile-mosaicking problem.
    caveat: >
      Values are residents per cell - a count, so summable, never averaged and
      never multiplied by cell area. Nodata -200.
      The GeoTIFF carries no EPSG projected code, only an ESRI WKT string, so some
      tools report an unnamed CRS. Pass the full WKT or
      "+proj=moll +lon_0=0 +datum=WGS84 +units=m", not a code.
    licence: CC-BY-4.0
    verified: 2026-10-06

  - id: ghsl_built_europe
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_1000/V1-0/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_1000_V1_0.zip
    access: download
    crs: ESRI:54009          # World Mollweide, same grid as ghsl_pop_europe
    purpose: >
      GHS-BUILT-S: built-up SURFACE per 1 km cell, 2025 epoch, one global file
      (153,290,977 B). The asset half of exposure. GHS-POP answers "how many
      people are in the water"; this answers "how much is built there", which is
      the question behind every recommendation about where building is still
      permitted. Same grid, same epoch, same CRS and same cell size as
      ghsl_pop_europe, so the two divide cell by cell with no reprojection and no
      resampling - which is the whole reason for taking the 1 km Mollweide
      version rather than the 100 m tiles.
    caveat: >
      Values are square METRES of built-up surface per cell, NOT a share: divide
      by the cell area (1 km2 = 1,000,000 m2) before calling any of it a
      percentage, or every figure is out by six orders of magnitude.
      It measures footprint, not value: a warehouse and a hospital of the same
      size are the same number here. It ranks what is physically at stake, never
      what it costs - say so, because a jury will ask.
      Same Mollweide trap as GHS-POP: the GeoTIFF carries an ESRI WKT string and
      no projected EPSG code, so pass the WKT or the proj4 string, not a code.
      The non-residential variant (GHS_BUILT_S_NRES) is NOT at the mirrored path
      this entry follows - checked 2026-10-06, it answers 404.
    licence: CC-BY-4.0
    verified: 2026-10-06

  - id: ghsl_pop_100m_tiles
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_100/V1-0/tiles/
    access: download
    crs: ESRI:54009
    # The url above is a directory of 375 tiles. Both Belgian tiles confirmed
    # present 2026-10-06: 41,973,700 B and 95,509,568 B.
    files:
      - GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R3_C19.zip
      - GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R4_C19.zip
    purpose: >
      GHS-POP at 100 m, tiled. ONLY for a zoom-in on one valley, not for the
      European run. Belgium needs TWO tiles: ..._R3_C19.zip (40 MB) and
      ..._R4_C19.zip (91 MB).
    caveat: >
      If you do zoom in, take BOTH tiles. The R3/R4 row boundary falls at
      51.2140 N, which cuts through Belgium: Brussels and Liege sit in R4, but
      Antwerp (51.22 N) and the northern border strip sit in R3. Taking only R4
      silently truncates northern Flanders while the total still looks plausible.
    licence: CC-BY-4.0
    verified: 2026-10-06

  - id: cems_emsr518_belgium_2021
    # The activation page is HTML; the products sit in a public S3 bucket, which
    # answers anonymously - verified 2026-10-06 with no credentials and a default
    # User-Agent. The portal's /accounts/login/ link does not gate this path.
    url: https://cems-mapping-website.s3.eu-west-1.amazonaws.com/static/activations/EMSR518/
    landing: https://mapping.emergency.copernicus.eu/activations/EMSR518/
    access: download
    # TWO delineations per AOI, not one: the first product and a later monitoring
    # pass. Taking only DEL_PRODUCT keeps the flood as first mapped and misses
    # how far it had spread days later, which is the extent the hazard maps
    # should actually be scored against. Sizes measured 2026-10-06.
    files:
      - EMSR518_AOI01_DEL_PRODUCT_r1_VECTORS_v1_vector.zip   # Liege, first,      34,180,203 B
      - EMSR518_AOI01_DEL_MONIT01_r1_VECTORS_v1_vector.zip   # Liege, monitoring, 23,520,959 B
      - EMSR518_AOI02_DEL_PRODUCT_r1_VECTORS_v1_vector.zip   # Rochefort, first,  66,152,047 B
      - EMSR518_AOI02_DEL_MONIT01_r1_VECTORS_v1_vector.zip   # Rochefort, monit., 55,827,584 B
    purpose: >
      Observed flood extent, July 2021, Belgium. Ground truth against which to
      validate the modelled hazard maps. Two AOIs: AOI01 Liege, AOI02 Rochefort,
      each with a first delineation and one monitoring pass - take all four, or
      the comparison is against the earliest extent rather than the largest.
      The extent is the observedEventA layer (151 polygons for AOI01, all tagged
      "Flooded area"), shipped as SHP + GeoJSON + KMZ, CRS WGS84.
    caveat: >
      Delineation products ONLY - this activation has no grading (damage severity)
      and no reference products. If the plan needs a damage layer for the Belgian
      2021 floods, it does not exist here.
      EMSR517 is the German side of the same event; do not mix them up.
      The "151 polygons" figure above predates this check and was not re-verified
      on 2026-10-06: the zips were sized, not opened.
    verified: 2026-10-06

  - id: drmkc_risk_data_hub
    url: https://drmkc.jrc.ec.europa.eu/risk-data-hub-api/risk-data-hub-service
    access: api
    purpose: >
      Curated EU exposure, vulnerability and historical loss data, as OGC API -
      Features. Endpoints: /losses/losses/items, /risks/vulnerability/items,
      /admin/{asset,division,hazard,metric}/items.
    caveat: >
      REQUIRES an EU Login account and a bearer token that expires after 10 hours,
      and unauthenticated calls hit a bot-defence challenge rather than a clean
      401. Create the account now and cache responses to disk; do not call this
      live in front of a jury. Everything else in this file is open.
    verified: 2026-10-06 (live call made - 77 hazards, 1,297 loss rows for BE)

  - id: wallonia_flood_hazard_official
    # Resolved 2026-10-06 through the Walloon CSW. The catalogue root that used to
    # be here is an HTML page, so it was fetched and stored as data.
    url: https://geoservices.wallonie.be/geotraitement/spwdatadownload/results/68cfc9ff-651a-4757-b792-6bde0e238c2f/
    landing: https://metawal.wallonie.be/geonetwork/srv/fre/catalog.search#/metadata/14084108-2c7b-4091-b62d-ff0fc235213a
    access: download
    crs: EPSG:31370         # Belgian Lambert 72, not 3035 and not 4326
    licence: CC-BY-4.0
    uuid_series: 14084108-2c7b-4091-b62d-ff0fc235213a   # "en vigueur" series
    uuid_raster: 68cfc9ff-651a-4757-b792-6bde0e238c2f   # the raster version below
    files:
      - ALEA_INOND_2020__ALEA_MAP_GEOTIFF_31370.zip     # 98,181,933 B
    attribution: >
      Source : Service public de Wallonie (SPW) - Cartographie de l'alea
      d'inondation (en vigueur) - Serie (2021-03-24)
    purpose: >
      OFFICIAL Walloon hazard map, revision 2024-10-14: overflow, surface runoff,
      and both combined, each at low/medium/high. The JRC maps cover river
      flooding only, so the unmodelled runoff is a real policy gap to point at.
      It is ONE combined layer carrying a class code, not three datasets. Field
      CLASSEMENT: 110/120/130 = low/medium/high by OVERFLOW (debordement),
      210/220/230 = by RUNOFF (ruissellement), 310/320/330 = both. So the runoff
      argument is made by selecting 2xx and 3xx - no second dataset needed.
      Other attributes: LOCALID, TYPEALEA, CODEALEA, VALEUR, STATUS, DECISION,
      MILLESIME.
    caveat: >
      LICENCE TRAP. These "alea" records are CC-BY 4.0 and redistributable. The
      separate "Zones inondables - Scenario de periode de retour {25,50,100,
      extreme}" records are NOT: they carry CPU Type A SPW, under which the user
      "ne peut pas redistribuer la donnee a un tiers" and printing is capped at
      1:10,000. Publishing a map from them is allowed, shipping the data is not -
      and this repo goes public. Use the CC-BY alea records for anything shared.
      There is no WFS. Besides the raster above, the series offers vector through
      its ATOM feed (atom_service.xml -> atom_dataset.xml under the series uuid):
      ALEA_GEOPACKAGE_31370.zip 448,277,133 B, ALEA_FILEGDB_31370.zip
      154,813,592 B, or SHAPE split per province (Liege 68,992,948 B, Namur
      61,534,486 B). An ArcGIS REST endpoint also answers GeoJSON at
      /arcgis/rest/services/EAU/ALEA_INOND/MapServer with maxRecordCount 2000, so
      it must be paginated - a count of CLASSEMENT=130 returns 7,947 polygons.
      The debordement-only product (uuid a3fa00be..., Version 2007) is OBSOLETE;
      do not use it, and do not use the 2016 or 2020 records the catalogue tags
      "donnee obsolete".
    verified: 2026-10-06

