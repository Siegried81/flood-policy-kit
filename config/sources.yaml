  # US counterpoint to the HLEG / AI Act frame. Declared as a counterpoint and
  # NOT as a replacement: the jury is European and the deliverable is scored
  # against the EU grid. These three earn their place because each answers a
  # question the EU frame leaves open, and the first one answers it with a proof.
  - id: nist_robust_ai_alignment_limits
    url: https://arxiv.org/pdf/2512.10100
    landing: https://www.nist.gov/publications/robust-ai-security-and-alignment-sisyphean-endeavor
    access: scrape
    doi: 10.1109/MSEC.2026.3678214
    purpose: >
      Vassilev, "Robust AI Security and Alignment: A Sisyphean Endeavor?", IEEE
      Security & Privacy 2026. Extends Goedel's incompleteness theorem to AI and
      establishes information-theoretic limits: NO finite set of guardrails is
      universally robust against adversarial prompts. Corroborated empirically -
      a fine-tuning "refuse-then-comply" attack bypassed Claude Haiku's controls
      in 72% of tested cases and GPT-4o's in 57%.
      This is the theory behind a result the sibling project measured: in
      grounded-rag the similarity refusal gate fired 0 times in 61 live
      questions, and the unanswerable questions' top cosine scores (0.599-0.888)
      covered the same range as the answerable ones - so no threshold value can
      separate them. The measurement and the proof say the same thing, and
      quoting both turns "our guardrail does not catch this" into a statement
      about what guardrails can do at all.
    caveat: >
      447,655 B PDF, verified 2026-10-06 on arXiv. The NIST-hosted PDF
      (tsapps.nist.gov/publication/get_pdf.cfm?pub_id=960858) answered 200 with
      433,677 B and then 404 twenty minutes later - intermittent, so arXiv is the
      declared URL and the NIST page is the landing reference.
      It is a US federal author on a US framework. Cite it for the limit it
      proves, not as a compliance authority for an EU deliverable.
    verified: 2026-10-06

