  - id: gisco_nuts3
    url: https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_01M_2024_3035_LEVL_3.geojson
    access: download
    crs: EPSG:3035
    purpose: >
      NUTS3 regions, 2024 vintage, 25 MB - the working unit for a European
      comparison. The file holds 1,345 polygons: 1,165 in the EU-27, 46 in EFTA
      and 134 in the candidate and potential-candidate countries. The level EU
      regional policy operates on, so the level a JRC jury thinks in.
    caveat: >
      Pin the vintage and say which: NUTS 2021 and NUTS 2024 are different
      geometries AND different code sets, and a file with no year in its name is
      a trap. The 1,166 figure quoted for "the number of NUTS3 regions" is the
      NUTS 2021 EU count; on this 2024 vintage the EU count is 1,165, because
      DEG0P (Eisenach) was absorbed into the Wartburgkreis. Say whether a count
      is EU-only or the whole file, or the denominator drifts.
    verified: 2026-10-06

  - id: gisco_lau
    url: https://gisco-services.ec.europa.eu/distribution/v2/lau/shp/LAU_RG_01M_2024_3035.shp.zip
    access: download
    crs: EPSG:3035
    purpose: >
      LAU (commune) boundaries, 2024, 39 MB. ONLY for a zoom-in on one country.
      Pan-European file, so filter CNTR_CODE; GISCO_ID is "<CC>_<local code>".
    caveat: >
      For Belgium: 581 communes here against 565 in the 2026 Statbel population
