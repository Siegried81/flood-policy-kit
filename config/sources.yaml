    # discovered by scraping the page - the resolved URL has to live here.
    url: https://statbel.fgov.be/sites/default/files/files/opendata/bevolking%20naar%20woonplaats%2C%20nationaliteit%20burgelijke%20staat%20%2C%20leeftijd%20en%20geslacht/TF_SOC_POP_STRUCT_2026.zip
    landing: https://statbel.fgov.be/en/open-data/population-place-residence-nationality-marital-status-age-and-sex-16
    access: download
    purpose: >
      TF_SOC_POP_STRUCT_2026 - population by commune x sex x nationality x marital
      status x single year of age (0-100). This is the equity lens: who, not how
      many. Join key CD_REFNIS (NIS5). 565 communes, 11,867,634 people at
      2026-01-01.
    caveat: >
      Pipe-delimited, and encoded UTF-8 WITH A BOM (EF BB BF) - read it with
      encoding="utf-8-sig". This entry previously said ISO-8859-1, which was
      wrong in the dangerous direction: forcing latin-1 produces exactly the
      mojibake the warning was trying to prevent ("Region flamande" becomes
      "RÃ©gion flamande"). Measured on the sibling income file 2026-10-06, whose
      first three bytes are EF BB BF and which decodes as UTF-8 end to end.
      Plain encoding="utf-8" is not enough either: the BOM stays glued to the
      first column name, so a lookup on CD_REFNIS fails.
      It is a fully crossed long table, so GROUP BY before use or you will count
      people many times over.
      The zip is 2,566,901 B and the member TF_SOC_POP_STRUCT_2026.txt is
      104,151,550 B, 21 columns, 467,615 data rows - 565 distinct CD_REFNIS
      summing to 11,867,634 people, which is the figure above confirmed.
    licence: CC-BY-4.0
    verified: 2026-10-06

