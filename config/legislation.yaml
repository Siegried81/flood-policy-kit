# Every legal and policy instrument the kit cites, one record each, in the
# shape the EU Data Law Observatory uses for its registry.
#
# Why a registry: the docs cite the Floods Directive by article in prose, and
# a CELEX number or an ELI URL lived only in docs/policy_context.md. One
# machine-readable record per instrument gives a brief its citation with the
# URL attached, and `tests/test_legislation.py` holds docs/policy_answer.md to
# it: an article cited there that is not listed here fails the suite.
#
# Fields, per instrument (keyed by abbreviation):
#   short      the name a citation uses ("Directive 2007/60/EC")
#   title      the full title as EUR-Lex carries it
#   celex      the CELEX number; never invented - a document without one is
#              not in this file (SWD(2021) 305 has none: Cellar answers 404)
#   type       directive | regulation | decision | recommendation |
#              communication | staff-working-document | proposal
#   enacted    date of the act (EUR-Lex "date of document")
#   in_force   entry into force; null for a non-binding or unadopted text.
#              Where EUR-Lex lists several dates (staggered application) this
#              is the earliest, the entry into force proper
#   eurlex_url the ELI URL where one exists, else the CELEX landing page
#   status     in_force | in_force_amended | non_binding | proposal
#   verified   the date the celex and dates were checked live, or null.
#              Live means the Publications Office Cellar SPARQL endpoint
#              (publications.europa.eu/webapi/rdf/sparql, predicates
#              cdm:resource_legal_id_celex, work_date_document,
#              resource_legal_date_entry-into-force, resource_legal_in-force):
#              eur-lex.europa.eu itself answers HTTP 202 with an empty body to
#              a scripted fetch, so the check cannot go through its pages
#   articles   the articles the kit relies on, one line each. For the Floods
#              Directive the notes quote the local copy of the act at
#              data/raw/scrape/floods_directive.html; the deadlines are the
#              Article's own words, not arithmetic

instruments:

  FD:
    short: Directive 2007/60/EC
    title: Directive 2007/60/EC of the European Parliament and of the Council of 23 October 2007 on the assessment and management of flood risks
    celex: 32007L0060
    type: directive
    enacted: 2007-10-23
    in_force: 2007-11-26
    eurlex_url: https://eur-lex.europa.eu/eli/dir/2007/60/oj
    status: in_force
    verified: 2026-10-08
    articles:
      "4": Preliminary flood risk assessment per river basin district, from available information including past floods and climate-change impacts; completed by 22 December 2011 (Art. 4(4)).
      "5": On the basis of Article 4, Member States identify the areas where a potential significant flood risk exists or might be considered likely to occur (APSFR); shared areas coordinated between the Member States concerned.
      "6": Flood hazard maps and flood risk maps for the Article 5 areas, for low, medium (return period >= 100 years) and high probability scenarios; completed by 22 December 2013 (Art. 6(8)).
      "6(3)": The three scenarios a flood hazard map shall cover - (a) "floods with a low probability, or extreme event scenarios"; (b) "floods with a medium probability (likely return period >= 100 years)"; (c) "floods with a high probability, where appropriate". A figure is given for (b) only; the kit's placing of RP10-RP75 as high and RP200-RP500 as low/extreme is its own reading, not the Article's.
      "7": Flood risk management plans with objectives and measures covering prevention, protection and preparedness including flood forecasts and early warning; completed and published by 22 December 2015 (Art. 7(5)).
      "7(4)": "In the interests of solidarity, a plan in one Member State shall not include measures which significantly increase flood risks upstream or downstream of other countries in the same basin, unless coordinated and agreed in the framework of Article 8."
      "8": Coordination of plans at river basin district level - one plan per national district, one international plan where the district lies entirely within the Community.
      "8(2)": Where an international river basin district falls entirely within the Community, Member States shall ensure coordination with the aim of producing one single international flood risk management plan.
      "8(3)": Where an international river basin district extends beyond the Community, Member States "shall endeavour" to produce one single international plan; where not possible, paragraph 2 applies to the parts inside their territory.
      "8(5)": A Member State that identifies an issue affecting its flood risk management which it cannot resolve may report it to the Commission and the other Member States concerned, with recommendations; "the Commission shall respond ... within a period of six months."
      "14": Six-yearly review of the preliminary assessment, the maps and the plans, with climate change taken into account.
      "14(1)": The preliminary flood risk assessment "shall be reviewed, and if necessary updated, by 22 December 2018 and every six years thereafter."
      "14(2)": The flood hazard maps and the flood risk maps "shall be reviewed, and if necessary updated, by 22 December 2019 and every six years thereafter."
      "14(3)": The flood risk management plan(s) "shall be reviewed, and if necessary updated, including the components set out in part B of the Annex, by 22 December 2021 and every six years thereafter."
      "14(4)": "The likely impact of climate change on the occurrence of floods shall be taken into account in the reviews referred to in paragraphs 1 and 3."
      "15": Member States make the assessment, the maps, the plans and their reviews available to the Commission within three months after the dates in Articles 4(4), 6(8), 7(5) and 14.
      "16": The Commission reports to the European Parliament and the Council on implementation by 22 December 2018 and every six years thereafter, taking the impact of climate change into account.

