[pytest]
# rasterstats 0.21 still computes `affine * (col, row)`, which affine deprecates in
# favour of `@`. It fires twice per zonal call (about 1,140 times per run) and buries
# any warning raised by this repo's own code. The filter is pinned to that message
# in that module, so the same deprecation anywhere else still shows.
filterwarnings =
    ignore:Use `@` matmul instead of `\*` mul operator:PendingDeprecationWarning:rasterstats.io
